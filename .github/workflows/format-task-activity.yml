name: Format Task Activity

on:
  push:
    branches:
      - feat/task-activity-comments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/task-activity-comments

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format activity files
        run: >-
          pnpm exec prettier --write
          apps/web/src/entities/task/lib/task-indexed-db.ts
          apps/web/src/entities/task/model/task-activity.test.ts
          apps/web/src/features/task-form/ui/task-activity-panel.tsx
          apps/web/src/features/task-form/ui/task-form.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/entities/task/lib/task-indexed-db.ts \
            apps/web/src/entities/task/model/task-activity.test.ts \
            apps/web/src/features/task-form/ui/task-activity-panel.tsx \
            apps/web/src/features/task-form/ui/task-form.tsx
          git commit -m "style(web): format task activity files"
          git push origin HEAD:feat/task-activity-comments
