name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format preview
        run: |
          npx prettier --write src/app/styles/global.css src/pages/project-board/project-board-page.tsx src/widgets/task-board/task-board.tsx
          git diff -- src/app/styles/global.css src/pages/project-board/project-board-page.tsx src/widgets/task-board/task-board.tsx
          git diff --exit-code -- src/app/styles/global.css src/pages/project-board/project-board-page.tsx src/widgets/task-board/task-board.tsx

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
