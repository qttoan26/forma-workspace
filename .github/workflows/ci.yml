name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format probe
        run: |
          pnpm exec prettier --write apps/web/src/pages/auth-callback/auth-callback-page.tsx apps/web/src/pages/login/login-page.tsx apps/web/src/shared/auth/oidc-client.test.ts apps/web/src/shared/auth/oidc-client.ts
          git diff -- apps/web/src/pages/auth-callback/auth-callback-page.tsx apps/web/src/pages/login/login-page.tsx apps/web/src/shared/auth/oidc-client.test.ts apps/web/src/shared/auth/oidc-client.ts
          exit 1

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
