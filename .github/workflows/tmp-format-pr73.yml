name: Temporary format PR 73

on:
  push:
    branches:
      - feat/forma-ui-finalize-frontend

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/forma-ui-finalize-frontend
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write tests/frontend/workspace-flow.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/frontend/workspace-flow.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: apply prettier to frontend smoke flow"
            git push origin HEAD:feat/forma-ui-finalize-frontend
          fi
