name: Format project multiview

on:
  push:
    branches:
      - feat/project-multiview

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/project-multiview
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and verify project view files
        run: |
          pnpm exec prettier --write apps/web/src/pages/project-board/project-task-views.tsx apps/web/src/pages/project-board/project-view.ts
          pnpm exec prettier --write apps/web/src/pages/project-board/project-task-views.tsx apps/web/src/pages/project-board/project-view.ts
          pnpm exec prettier --check apps/web/src/pages/project-board/project-task-views.tsx apps/web/src/pages/project-board/project-view.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/project-board/project-task-views.tsx apps/web/src/pages/project-board/project-view.ts
          git commit -m "style(web): format project multiview files"
          git push origin HEAD:feat/project-multiview
