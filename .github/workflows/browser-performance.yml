name: Browser Performance

on:
  workflow_dispatch:
    inputs:
      task_counts:
        description: Comma-separated task counts for the browser benchmark
        required: false
        default: '1000,10000'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browser-performance.yml'
      - 'apps/web/**'
      - 'docs/performance/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  task-board-browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORMA_BROWSER_TASK_COUNTS: ${{ inputs.task_counts || '1000,10000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @forma/web exec playwright install --with-deps chromium

      - name: Run browser benchmark
        run: pnpm benchmark:browser
