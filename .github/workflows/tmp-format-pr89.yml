name: Temporary format PR 89

on:
  push:
    branches:
      - feat/task-sync-manual-retry

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/task-sync-manual-retry
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/pages/project-board/project-board-sync-status.tsx src/pages/project-board/project-board-sync-status.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/project-board/project-board-sync-status.tsx src/pages/project-board/project-board-sync-status.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: apply prettier formatting"
            git push origin HEAD:feat/task-sync-manual-retry
          fi
