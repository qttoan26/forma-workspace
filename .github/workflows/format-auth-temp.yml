name: Format Auth Temp

on:
  push:
    branches:
      - feat/api-auth-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/api-auth-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write apps/api/src/auth/authentication.guard.ts apps/api/src/config/runtime-config.ts apps/api/src/tasks/tasks.controller.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/auth/authentication.guard.ts apps/api/src/config/runtime-config.ts apps/api/src/tasks/tasks.controller.test.ts
          git commit -m "style: format auth foundation files"
          git push origin HEAD:feat/api-auth-foundation
