name: Format Gr8r surface

on:
  push:
    branches:
      - feat/gr8r-module-surface

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/gr8r-module-surface
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed frontend files
        run: >-
          pnpm exec prettier --write
          apps/web/src/pages/module/module-page.tsx
          apps/web/src/pages/module/work-section-surface.css
          apps/web/src/widgets/workspace-shell/workspace-shell.tsx

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/module/module-page.tsx apps/web/src/pages/module/work-section-surface.css apps/web/src/widgets/workspace-shell/workspace-shell.tsx
          git commit -m "style(web): format Gr8r module surfaces"
          git push origin HEAD:feat/gr8r-module-surface
