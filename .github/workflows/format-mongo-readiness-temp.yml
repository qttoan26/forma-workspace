name: Format Mongo Readiness Temp

on:
  push:
    branches:
      - feat/mongodb-readiness

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mongodb-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write apps/api/src/database/mongo-database.service.ts apps/api/src/health.controller.ts apps/api/src/tasks/mongo-task.repository.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/database/mongo-database.service.ts apps/api/src/health.controller.ts apps/api/src/tasks/mongo-task.repository.ts
          git commit -m "style: format MongoDB readiness files"
          git push origin HEAD:feat/mongodb-readiness
