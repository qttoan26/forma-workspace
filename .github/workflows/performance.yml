name: Performance Baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/performance.yml'
      - 'src/app/styles/**'
      - 'src/pages/home/**'
      - 'src/pages/project-board/**'
      - 'src/widgets/task-board/**'
      - 'tests/performance/**'
      - 'docs/performance/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  task-board-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run task board benchmark
        run: npm run benchmark:task-board
