name: Format Debug

on:
  push:
    branches:
      - feat/landing-page-design-skill

permissions:
  contents: read

jobs:
  print-prettier-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: npm install --no-audit --no-fund
      - run: npx prettier src/pages/landing/landing-page.tsx
