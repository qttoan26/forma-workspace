name: API Container

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/api-container.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/api-container.yml'

permissions:
  contents: read

concurrency:
  group: api-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t forma-api:test .

      - name: Create container network
        run: docker network create forma-test

      - name: Start MongoDB
        run: docker run --detach --network forma-test --name forma-mongo mongo:8.2

      - name: Start API container
        run: |
          docker run --detach \
            --network forma-test \
            --publish 3001:3001 \
            --env MONGODB_URI=mongodb://forma-mongo:27017 \
            --env MONGODB_DB=forma_workspace_test \
            --name forma-api \
            forma-api:test

      - name: Verify MongoDB-backed API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health | grep -q '"persistence":"mongodb"'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy with MongoDB"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent \
            --request PUT \
            --header 'Content-Type: application/json' \
            --data '{"tasks":[{"id":"task-smoke","projectId":"project-smoke","title":"Mongo smoke task","status":"todo","priority":"medium"}],"expectedRevision":0}' \
            http://127.0.0.1:3001/api/projects/project-smoke/tasks \
            | grep -q '"revision":1'

          curl --fail --silent \
            http://127.0.0.1:3001/api/projects/project-smoke/tasks \
            | grep -q '"revision":1'

          stale_status=$(curl --silent \
            --output /tmp/stale-response.json \
            --write-out '%{http_code}' \
            --request PUT \
            --header 'Content-Type: application/json' \
            --data '{"tasks":[{"id":"task-stale","projectId":"project-smoke","title":"Stale overwrite","status":"done","priority":"high"}],"expectedRevision":0}' \
            http://127.0.0.1:3001/api/projects/project-smoke/tasks)

          test "$stale_status" = '409'
          grep -q '"actualRevision":1' /tmp/stale-response.json

          curl --fail --silent \
            http://127.0.0.1:3001/api/projects/project-smoke/tasks \
            | grep -q '"title":"Mongo smoke task"'

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs forma-mongo || true
          docker logs forma-api || true
