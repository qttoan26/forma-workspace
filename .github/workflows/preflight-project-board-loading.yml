name: Project Board Loading Preflight

on:
  push:
    branches: [feat/project-board-loading-state]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format
        run: |
          npm run format
          git diff --exit-code

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
